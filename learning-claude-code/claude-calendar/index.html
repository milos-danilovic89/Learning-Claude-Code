<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <button id="prev-btn" aria-label="Previous month">&#8249;</button>
      <h1 id="month-heading"></h1>
      <button id="next-btn" aria-label="Next month">&#8250;</button>
    </header>

    <div id="grid"></div>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <button id="close-btn" aria-label="Close">&times;</button>
      <h2 id="modal-title">Add Event</h2>
      <form id="event-form" novalidate>
        <label for="title">Title *</label>
        <input type="text" id="title" placeholder="Event title" maxlength="100" autocomplete="off">

        <label for="date">Date *</label>
        <input type="date" id="date">

        <label for="description">Description</label>
        <textarea id="description" rows="3" placeholder="Optional notes"></textarea>

        <p id="past-date-warning" class="warning hidden">This date is in the past.</p>
        <p id="form-error" class="error hidden"></p>

        <div class="modal-actions">
          <button type="submit" id="save-btn">Save</button>
          <button type="button" id="cancel-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
